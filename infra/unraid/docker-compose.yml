name: ai-brain

# ---------------------------------------------------------------------------
# ai-brain on Unraid — consumes the prebuilt GHCR image (no local build).
#
# Prerequisites (run once on the Unraid host):
#   1. ./setup-unraid.sh           # creates /mnt/user/appdata/ai-brain + secrets
#   2. The GHCR package must be PUBLIC, otherwise authenticate first:
#        docker login ghcr.io -u <github-user> -p <github-PAT-with-read:packages>
#
# All runtime config (DB password, AUTH_SECRET, AUTH_URL, SMTP, …) lives in
#   /mnt/user/appdata/ai-brain/ai-brain.env
# which the setup script generates. Edit AUTH_URL there to match how you browse.
#
# Pin a release by changing ":master" to a tag like ":v1.0.0" once you cut one.
# Paths below assume the default appdata location; change them all together if
# you set a custom APPDATA in the setup script.
# ---------------------------------------------------------------------------

x-image: &image ghcr.io/thejoshgriffith/ai-brain:master
x-env: &env-file
  env_file:
    - /mnt/user/appdata/ai-brain/ai-brain.env

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-brain-db
    restart: unless-stopped
    <<: *env-file
    volumes:
      - /mnt/user/appdata/ai-brain/postgres:/var/lib/postgresql/data
    # pgvector is enabled by the first DB migration — no init script needed.
    # Uncomment to reach Postgres from the LAN (e.g. a DB GUI). Not required.
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_brain -d ai_brain"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: apply DB migrations, then exit. App services wait for success.
  migrate:
    image: *image
    container_name: ai-brain-migrate
    command: ["pnpm", "--filter", "@ai-brain/db", "db:migrate"]
    <<: *env-file
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: *image
    container_name: ai-brain-web
    command: ["pnpm", "--filter", "@ai-brain/web", "start"]
    <<: *env-file
    ports:
      - "3002:3002"
    volumes:
      - /mnt/user/appdata/ai-brain/models:/app/.models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:3002]/"

  mcp:
    image: *image
    container_name: ai-brain-mcp
    command: ["pnpm", "--filter", "@ai-brain/mcp", "start:http"]
    <<: *env-file
    ports:
      - "8787:8787"
    volumes:
      - /mnt/user/appdata/ai-brain/models:/app/.models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: *image
    container_name: ai-brain-worker
    command: ["pnpm", "--filter", "@ai-brain/worker", "start"]
    <<: *env-file
    volumes:
      - /mnt/user/appdata/ai-brain/models:/app/.models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
